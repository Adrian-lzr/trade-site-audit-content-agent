services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trade_visibility}
      POSTGRES_USER: ${POSTGRES_USER:-trade_visibility}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trade_visibility} -d ${POSTGRES_DB:-trade_visibility}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
